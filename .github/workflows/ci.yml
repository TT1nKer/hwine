name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
        working-directory: hwine-rs
      - name: Clippy
        run: cargo clippy --all-targets --all-features
        working-directory: hwine-rs
        env:
          RUSTFLAGS: "-D warnings"
      - name: Test
        run: cargo test --all-targets
        working-directory: hwine-rs
      - name: Build examples
        run: cargo build --examples
        working-directory: hwine-rs

  bench-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run real benchmarks (smoke)
        run: cargo run --release --example bench_real
        working-directory: hwine-rs
      - name: Run streaming FIR
        run: cargo run --release --example stream_fir_bench
        working-directory: hwine-rs
      - name: Run formal equivalence (no Yosys)
        run: cargo run --release --example formal_equiv
        working-directory: hwine-rs
