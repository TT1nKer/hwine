name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hwine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --lib -D warnings
      - run: cargo test --all-targets
